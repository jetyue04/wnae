apiVersion: batch/v1
kind: Job
metadata:
  name: wnae-job-toy10d-minmax
  namespace: axol1tl
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tuner
          image: python:3.10-slim
          imagePullPolicy: Always
          volumeMounts:
            - name: axovol
              mountPath: /axovol
          workingDir: /axovol/wnae_10_14

          command:
            - "/bin/bash"
            - "-c"
            - |
              set -e
              # install python deps
              python -m pip install --no-cache-dir -r requirements.txt
              python -m pip install numpy==1.23.5
              python -m pip install scipy==1.13.1
              # run the script
              python -u train_toy.py --override data.N=3 data.D=10 training.n_epochs=500 wnae.x_step_size=0.1 data.min_max=true data.output="output/toy10d_minmax"| tee wnae_toy_10d_minmax.log

          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 2
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 2
      volumes:
        - name: axovol
          persistentVolumeClaim:
            claimName: axovol
